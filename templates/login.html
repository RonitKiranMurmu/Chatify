<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Chatify</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#f5f7fa,#e8eef5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Login to Chatify</h2>
        <div id="logged-out-banner" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-800 rounded">You have been logged out.</div>

        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input name="username" required class="mt-1 block w-full rounded-full border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="mt-1 block w-full rounded-full border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>
            <div class="flex items-center justify-between">
                <a href="/register" class="text-sm text-blue-600">Register</a>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-full">Login</button>
            </div>
        </form>
    </div>

    <script>
    (function(){
        try{
            const params = new URLSearchParams(window.location.search);
            if (params.get('logged_out') === '1') {
                document.getElementById('logged-out-banner').classList.remove('hidden');
            }
        }catch(e){console.warn(e)}
    })();
    </script>
</body>
</html>
