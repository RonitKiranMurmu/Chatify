<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatify</title>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.5/client-dist/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/plugin/relativeTime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/plugin/isToday.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/plugin/isYesterday.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        :root {
            --bg-1: #f5f7fa;
            --bg-2: #e8eef5;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --brand: #3b82f6;
            --brand-strong: #2563eb;
            --sent: #dbeafe;
            --recv: #f3f4f6;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        #chat-container, #login-container {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }
        #chat-area {
            height: 70vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
        }
        .message {
            max-width: 75%;
            margin: 8px 12px;
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.45;
        }
        .message.sent {
            background: var(--sent);
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .message.received {
            background: var(--recv);
            border-bottom-left-radius: 5px;
        }
        .message .timestamp {
            font-size: 0.72rem;
            color: var(--muted);
            text-align: right;
            margin-top: 6px;
        }
        .message .user-id {
            font-weight: 600;
            font-size: 0.85rem;
            margin-right: 6px;
            color: #111827;
        }
        input[type="text"], input[type="file"] {
            border-radius: 24px;
            background: #f9fafb;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            outline: none;
        }
        #send-button, #file-button, #login-button {
            border-radius: 24px;
            background: var(--brand);
            color: #fff;
            border: none;
            padding: 10px 16px;
            transition: background 0.15s ease;
        }
        #send-button:hover, #file-button:hover, #login-button:hover {
            background: var(--brand-strong);
        }
        #status {
            font-size: 0.85rem;
            color: var(--muted);
        }
        #chat-area::-webkit-scrollbar { width: 8px; }
        #chat-area::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="login-container" class="max-w-md mx-auto mt-10">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Join Chatify</h2>
        <input type="text" id="user-id-input" placeholder="Your ID (e.g., user1)" class="w-full mb-4">
        <button id="login-button" class="w-full">Join Chat</button>
    </div>

    <!-- Chat -->
    <div id="chat-container" class="max-w-2xl mx-auto mt-10 hidden">
        <div id="chat-area" class="mb-4"></div>

        <div class="flex items-center space-x-2">
            <input type="text" id="message-input" placeholder="Type a message..." class="flex-1">
            <button id="send-button">Send</button>
        </div>

        <div class="flex items-center space-x-2 mt-2">
            <input type="file" id="file-input" accept="image/*,text/plain" class="flex-1">
            <button id="file-button">Send File</button>
        </div>

        <div id="status" class="mt-2">
            Connecting... | Server: <span id="server-info"></span>
            <button onclick="forceResetApplication(); location.reload();" style="margin-left: 10px; padding: 2px 8px; font-size: 0.75rem; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Reset Chat</button>
        </div>
    </div>

    <script>
    // Day.js plugins
    dayjs.extend(dayjs_plugin_relativeTime);
    dayjs.extend(dayjs_plugin_isToday);
    dayjs.extend(dayjs_plugin_isYesterday);

    // Socket setup
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const socketUrl = isLocal ? 'http://localhost:8000' : window.location.origin;
    const socket = io(socketUrl, {
        transports: ['websocket'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        timeout: 10000,
        randomizationFactor: 0.5
    });

    // DOM references
    const loginContainer = document.getElementById("login-container");
    const chatContainer = document.getElementById("chat-container");
    const userIdInput = document.getElementById("user-id-input");
    const messageInput = document.getElementById("message-input");
    const fileInput = document.getElementById("file-input");
    const loginButton = document.getElementById("login-button");
    const sendButton = document.getElementById("send-button");
    const fileButton = document.getElementById("file-button");
    const statusDiv = document.getElementById("status");
    const serverInfo = document.getElementById("server-info");
    const chatArea = document.getElementById("chat-area");

    // Dynamic encryption key from server
    let key = null;
    let keyReady = false;
    
    function clearMessageCache() {
        localStorage.removeItem('chatMessages');
        localStorage.removeItem('lastEncryptionKey');
        sessionStorage.clear(); // Clear session storage too
        console.log("All message cache and storage cleared");
    }
    
    function forceResetApplication() {
        // Clear all storage
        clearMessageCache();
        // Clear chat area
        chatArea.innerHTML = '';
        console.log("Application reset completed");
    }
    
    // Fetch encryption key from server
    async function initializeEncryption() {
        try {
            const response = await fetch('/encryption-key');
            const data = await response.json();
            
            // Check if encryption key has changed OR if this is first time
            const lastEncryptionKey = localStorage.getItem('lastEncryptionKey');
            const appVersion = localStorage.getItem('appVersion');
            const currentVersion = "2.0"; // Version with new encryption system
            
            if (!lastEncryptionKey || lastEncryptionKey !== data.key || appVersion !== currentVersion) {
                console.log("Encryption system updated or key changed, clearing cache");
                clearMessageCache();
                localStorage.setItem('appVersion', currentVersion);
            }
            
            key = CryptoJS.enc.Hex.parse(data.key);
            keyReady = true;
            
            // Store current encryption key for future comparison
            localStorage.setItem('lastEncryptionKey', data.key);
            
            console.log("Client encryption key synchronized with server");
        } catch (error) {
            console.error("Failed to fetch encryption key:", error);
            // Clear cache but don't force reset during login
            clearMessageCache();
            // Fallback to default key for compatibility
            const secretPhrase = "peerpulse-secret-2025";
            key = CryptoJS.SHA256(secretPhrase);
            keyReady = true;
            console.log("Using fallback encryption key due to server error");
        }
    }

    serverInfo.textContent = socketUrl;
    userIdInput.value = localStorage.getItem("userId") || "";
    
    // Debug: Verify DOM elements exist
    console.log("DOM elements check:");
    console.log("loginButton:", !!loginButton);
    console.log("loginContainer:", !!loginContainer);
    console.log("chatContainer:", !!chatContainer);
    console.log("userIdInput:", !!userIdInput);
    
    // Initialize encryption on page load (with error handling)
    initializeEncryption().catch(error => {
        console.error("Failed to initialize encryption on page load:", error);
        // Continue with fallback - don't break the page
        keyReady = false;
    });

    // Track processed message IDs to prevent duplicates
    const processedMessageIds = new Set();

    // Helpers
    function toSeconds(rawTs) {
        const n = Number(rawTs);
        if (!isFinite(n) || n <= 0) return Math.floor(Date.now() / 1000);
        return n >= 1e11 ? Math.floor(n / 1000) : Math.floor(n);
    }

    function formatTimestamp(rawTs) {
        const ts = toSeconds(rawTs);
        const date = new Date(ts * 1000);
        if (dayjs(date).isToday()) {
            return `Today, ${dayjs(date).format('h:mm A')}`;
        } else if (dayjs(date).isYesterday()) {
            return `Yesterday, ${dayjs(date).format('h:mm A')}`;
        }
        return dayjs(date).format('MMM D, YYYY, h:mm A');
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function encryptMessage(plaintext) {
        if (!keyReady || !key) {
            console.error("Encryption key not ready");
            return null;
        }
        
        const iv = CryptoJS.lib.WordArray.random(16);
        const encrypted = CryptoJS.AES.encrypt(
            plaintext,
            key,
            {
                iv: iv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            }
        );
        const ivCt = iv.concat(encrypted.ciphertext);
        return CryptoJS.enc.Base64.stringify(ivCt);
    }

    function decryptMessage(ciphertextBase64) {
        if (!keyReady || !key) {
            console.error("Decryption key not ready, keyReady:", keyReady, "key:", !!key);
            return null;
        }
        
        try {
            // Debug logging
            console.log("Attempting to decrypt message:", ciphertextBase64.substring(0, 50) + "...");
            
            const decoded = CryptoJS.enc.Base64.parse(ciphertextBase64);
            if (decoded.sigBytes < 16) {
                throw new Error('Ciphertext too short: ' + decoded.sigBytes + ' bytes');
            }

            // Extract IV (first 16 bytes / 4 words)
            const iv = CryptoJS.lib.WordArray.create(decoded.words.slice(0, 4));

            // Extract ciphertext (rest)
            const ct = CryptoJS.lib.WordArray.create(
                decoded.words.slice(4),
                decoded.sigBytes - 16
            );

            // Decrypt
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: ct },
                key,
                {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                }
            );

            // Convert to UTF-8
            let plaintext = decrypted.toString(CryptoJS.enc.Utf8);
            if (!plaintext) {
                throw new Error('Decryption resulted in empty string');
            }
            
            // Check if the result is still encrypted (double encryption fix)
            if (isLikelyEncryptedText(plaintext)) {
                console.warn("Detected double-encrypted message, attempting second decryption...");
                try {
                    const secondDecryption = decryptMessage(plaintext);
                    if (secondDecryption && !isLikelyEncryptedText(secondDecryption)) {
                        console.log("Double decryption successful:", secondDecryption.substring(0, 50) + "...");
                        return secondDecryption;
                    }
                } catch (secondError) {
                    console.warn("Second decryption failed, using first result");
                }
            }
            
            console.log("Decryption successful:", plaintext.substring(0, 50) + "...");
            return plaintext;
        } catch (error) {
            console.error('Decryption failed for message:', ciphertextBase64.substring(0, 50) + "...");
            console.error('Decryption error details:', error.message);
            console.error('Key ready:', keyReady, 'Key exists:', !!key);
            return null;  // Or handle gracefully
        }
    }

    // Helper function to detect if text looks like encrypted data
    function isLikelyEncryptedText(text) {
        // Check if text looks like base64 encoded data
        if (text.length < 20) return false;
        
        // Base64 pattern: mostly alphanumeric with +, /, = characters
        const base64Pattern = /^[A-Za-z0-9+/]+=*$/;
        const isBase64Like = base64Pattern.test(text.replace(/\s/g, ''));
        
        // Also check for URL-safe base64 (- and _ instead of + and /)
        const urlSafeBase64Pattern = /^[A-Za-z0-9_-]+=*$/;
        const isUrlSafeBase64Like = urlSafeBase64Pattern.test(text.replace(/\s/g, ''));
        
        return (isBase64Like || isUrlSafeBase64Like) && text.length > 20;
    }
    
    // Enhanced decryption that handles double-encrypted messages
    function smartDecrypt(ciphertextBase64) {
        try {
            // First decryption attempt
            const firstDecryption = decryptMessage(ciphertextBase64);
            if (!firstDecryption) return null;
            
            // Check if result is still encrypted (double encryption)
            if (isLikelyEncryptedText(firstDecryption)) {
                console.warn("Detected double encryption, attempting second decryption...");
                try {
                    const secondDecryption = decryptMessage(firstDecryption);
                    if (secondDecryption && !isLikelyEncryptedText(secondDecryption)) {
                        console.log("Double decryption successful!");
                        return secondDecryption;
                    }
                } catch (e) {
                    console.warn("Second decryption failed, using first result");
                }
            }
            
            return firstDecryption;
        } catch (error) {
            console.error("Smart decrypt failed:", error);
            return null;
        }
    }

    function appendMessage({ user_id, contentHtml, isSent, timestamp }) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${isSent ? 'sent' : 'received'}`;
        wrapper.innerHTML =
            `<span class="user-id">${escapeHtml(user_id)}:</span> ${contentHtml}
             <div class="timestamp">${formatTimestamp(timestamp)}</div>`;
        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function prependMessage({ user_id, contentHtml, isSent, timestamp }) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${isSent ? 'sent' : 'received'}`;
        wrapper.innerHTML =
            `<span class="user-id">${escapeHtml(user_id)}:</span> ${contentHtml}
             <div class="timestamp">${formatTimestamp(timestamp)}</div>`;
        
        // Insert at the beginning and preserve scroll position
        const oldScrollHeight = chatArea.scrollHeight;
        chatArea.insertBefore(wrapper, chatArea.firstChild);
        const newScrollHeight = chatArea.scrollHeight;
        chatArea.scrollTop += (newScrollHeight - oldScrollHeight);
    }

    // Message caching
    function cacheMessages(messages) {
        const validMessages = messages.filter(msg =>
            msg && 
            msg.msg_id && 
            msg.user_id && 
            msg.message && 
            typeof msg.message === 'string' && 
            msg.timestamp
        );
        localStorage.setItem('chatMessages', JSON.stringify(validMessages.slice(-100)));
    }

    async function loadCachedMessages() {
        const cached = localStorage.getItem('chatMessages');
        if (!cached) return;

        // Cache validation is now handled in initializeEncryption()

        // Ensure encryption is ready before processing cached messages
        if (!keyReady) {
            console.log("Encryption not ready for cached messages, initializing...");
            await initializeEncryption();
        }

        let messages = JSON.parse(cached);
        let validMessages = [];
        
        messages.forEach(msg => {
            if (!msg.message || typeof msg.message !== 'string' || !msg.msg_id) {
                console.warn(`Skipping invalid cached message`);
                return;
            }

            // Skip if already processed
            if (processedMessageIds.has(msg.msg_id)) {
                return;
            }
            processedMessageIds.add(msg.msg_id);

            let contentHtml;
            const isSystem = msg.user_id === "System";
            
            try {
                const decrypted = smartDecrypt(msg.message);
                if (!decrypted) {
                    console.warn(`Smart decrypt failed for cached message: ${msg.msg_id}`);
                    contentHtml = isSystem ? '[Cached System Message]' : '[Cached Message - Decryption Failed]';
                } else {
                    contentHtml = msg.type === 'file' ?
                        `<a href="data:application/octet-stream;base64,${escapeHtml(decrypted)}" download="${escapeHtml(msg.filename || 'file')}" class="underline" style="color: var(--brand-strong);">Download ${escapeHtml(data.filename || 'file')}</a>` :
                        escapeHtml(decrypted);
                }
                validMessages.push(msg);
            } catch (e) {
                console.error(`Smart decrypt failed for cached message:`, e);
                contentHtml = isSystem ? '[Cached System Error]' : '[Cached Decryption Error]';
            }

            appendMessage({
                user_id: msg.user_id || 'Unknown',
                contentHtml,
                isSent: msg.user_id === localStorage.getItem('userId'),
                timestamp: msg.timestamp
            });
        });

        cacheMessages(validMessages);
    }

    // Load all blockchain messages on login - no infinite scroll for now
    function loadAllBlockchainMessages() {
        console.log("Loading all blockchain messages...");
        allMessages = []; // Reset message array
        blockchainLoadingComplete = false;
        socket.emit('request_blockchain', { offset: 0, limit: 1000 }); // Load all messages
        
        // Set a timeout to mark loading as complete and display messages
        setTimeout(() => {
            displaySortedMessages();
        }, 2000); // Give 2 seconds for all blockchain messages to arrive
    }

    // Display all messages in chronological order
    function displaySortedMessages() {
        console.log("Displaying sorted blockchain messages...");
        blockchainLoadingComplete = true;
        
        // Sort all messages by timestamp (oldest first)
        allMessages.sort((a, b) => a.timestamp - b.timestamp);
        
        // Clear chat area and redisplay all messages in order
        chatArea.innerHTML = '';
        processedMessageIds.clear();
        
        allMessages.forEach(msg => {
            if (!processedMessageIds.has(msg.msg_id)) {
                processedMessageIds.add(msg.msg_id);
                appendMessage(msg);
            }
        });
        
        console.log(`Displayed ${allMessages.length} blockchain messages in chronological order`);
    }
    
    // Reset message state when user logs in
    function resetMessageState() {
        // Clear chat area
        chatArea.innerHTML = '';
        // Reset processed messages
        processedMessageIds.clear();
    }

    // Login
    loginButton.onclick = async () => {
        console.log("Login button clicked");
        const userId = userIdInput.value.trim();
        console.log(`User ID entered: "${userId}"`);

        if (!userId) {
            console.error("User ID is empty");
            alert("Please enter a User ID.");
            return;
        }
        if (userId.length > 50) {
            console.error(`User ID too long: ${userId.length} characters`);
            alert("User ID must be 50 characters or less.");
            return;
        }

        // Disable button to prevent double-clicks
        loginButton.disabled = true;
        loginButton.textContent = "Joining...";
        
        try {
            console.log("Storing userId in localStorage:", userId);
            localStorage.setItem("userId", userId);
            
            // Initialize encryption (but don't fail if it doesn't work)
            try {
                if (!keyReady) {
                    console.log("Initializing encryption...");
                    await initializeEncryption();
                }
            } catch (encryptionError) {
                console.warn("Encryption initialization failed, continuing with fallback:", encryptionError);
                // Use fallback key
                const secretPhrase = "peerpulse-secret-2025";
                key = CryptoJS.SHA256(secretPhrase);
                keyReady = true;
            }
            
            console.log("Emitting join event with userId:", userId);
            socket.emit('join', userId);
            
            // Show chat interface
            loginContainer.classList.add("hidden");
            chatContainer.classList.remove("hidden");
            
            // Reset message state
            resetMessageState();
            
            // Load all blockchain messages (contains complete history)
            setTimeout(() => {
                try {
                    loadAllBlockchainMessages();
                    // Don't load cached messages - blockchain contains everything
                } catch (error) {
                    console.warn("Failed to load blockchain messages:", error);
                    // Fallback to cached messages only if blockchain fails
                    loadCachedMessages();
                }
            }, 100);
            
        } catch (e) {
            console.error("Error during login process:", e);
            alert(`Failed to join chat: ${e.message}\n\nPlease try refreshing the page.`);
            statusDiv.textContent = `Join Failed: ${e.message} | Server: ${socketUrl}`;
            statusDiv.classList.add("text-red-400");
        } finally {
            // Always re-enable button
            loginButton.disabled = false;
            loginButton.textContent = "Join Chat";
        }
    };

    // Socket events
    socket.on("connect", () => {
        console.log("Connected to WebSocket server");
        statusDiv.textContent = `Connected | Server: ${socketUrl}`;
        statusDiv.classList.remove("text-red-400");
        statusDiv.classList.add("text-green-600");
        appendMessage({
            user_id: "System",
            contentHtml: "Connected to server",
            isSent: false,
            timestamp: Math.floor(Date.now() / 1000)
        });
        socket.emit("request_blockchain", { offset: 0, limit: 20 });
        messageOffset = 20;
    });

    socket.on("connect_error", (error) => {
        console.error('WebSocket connection failed:', error);
        statusDiv.textContent = `Connection Failed: ${error.message} | Server: ${socketUrl}`;
        statusDiv.classList.remove("text-green-600");
        statusDiv.classList.add("text-red-400");
        alert("Failed to connect to server. Please check your network and try again.");
    });

    socket.on("status", (data) => {
        console.log("Status received:", JSON.stringify(data, null, 2));
        statusDiv.textContent = `${data.message} | Server: ${socketUrl}`;
        statusDiv.classList.toggle("text-red-400", data.message.includes('Error'));
        statusDiv.classList.toggle("text-green-600", data.message === 'Connected');
    });

    // Store all messages to sort them properly
    let allMessages = [];
    let blockchainLoadingComplete = false;

    socket.on("message", async (data) => {
        console.log("Message received:", data.msg_id);
        
        // Prevent duplicate message display
        if (processedMessageIds.has(data.msg_id)) {
            console.log("Duplicate message ignored:", data.msg_id);
            return;
        }
        processedMessageIds.add(data.msg_id);
        
        let messageContent = data.message || "";
        const userId = localStorage.getItem("userId") || "Unknown";
        const isSent = data.user_id === userId;
        const isSystem = data.user_id === "System";

        let contentHtml;
        try {
            // Check if encryption is ready before attempting decryption
            if (!keyReady) {
                console.warn("Encryption not ready, waiting...");
                await initializeEncryption();
            }
            
            const decrypted = smartDecrypt(messageContent);
            if (!decrypted) {
                console.warn(`Smart decryption failed for message: ${data.msg_id}`);
                // Don't show raw encrypted text, show error message instead
                contentHtml = isSystem ? '[System Message Error]' : '[Message Decryption Failed]';
            } else {
                contentHtml = data.type === 'file' ?
                    `<a href="data:application/octet-stream;base64,${escapeHtml(decrypted)}" download="${escapeHtml(data.filename || 'file')}" class="underline" style="color: var(--brand-strong);">Download ${escapeHtml(data.filename || 'file')}</a>` :
                    escapeHtml(decrypted);
            }
        } catch (e) {
            console.error(`Decryption error for message ${data.msg_id}:`, e);
            contentHtml = isSystem ? '[System Error]' : '[Decryption Error]';
        }

        // Store message for proper sorting
        const messageObj = {
            user_id: data.user_id || "Unknown",
            contentHtml,
            isSent,
            timestamp: data.timestamp,
            msg_id: data.msg_id,
            is_blockchain_load: data.is_blockchain_load
        };

        if (data.is_blockchain_load) {
            // Collect blockchain messages for sorting
            allMessages.push(messageObj);
        } else {
            // Real-time message - display immediately
            appendMessage(messageObj);
            
            // Cache real-time messages
            let messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
            messages.push(data);
            cacheMessages(messages);
        }
    });

    socket.on("typing", (data) => {
        console.log("Typing indicator:", data);
        statusDiv.textContent = `${escapeHtml(data.user_id)} is typing... | Server: ${socketUrl}`;
    });

    socket.on("stop_typing", () => {
        console.log("Stop typing received");
        statusDiv.textContent = `Connected | Server: ${socketUrl}`;
        statusDiv.classList.add("text-green-600");
        statusDiv.classList.remove("text-red-400");
    });

    socket.on("disconnect", () => {
        console.log("Disconnected from WebSocket server");
        statusDiv.textContent = `Disconnected | Server: ${socketUrl}`;
        statusDiv.classList.remove("text-green-600");
        statusDiv.classList.add("text-red-400");
        alert("Disconnected from server. Please refresh to reconnect.");
    });

    socket.on("blockchain_complete", () => {
        console.log("Blockchain loading complete signal received");
        displaySortedMessages();
    });

    // Send text
    let typingTimeout;
    sendButton.onclick = async () => {
        const userId = localStorage.getItem("userId") || "Unknown";
        const message = messageInput.value.trim();
        
        if (!message || !userId || message.length > 1000) {
            alert("Please enter a valid message (max 1000 characters).");
            return;
        }
        
        // Ensure encryption is ready
        if (!keyReady) {
            console.log("Encryption not ready, initializing...");
            await initializeEncryption();
        }
        
        const encrypted = encryptMessage(message);
        if (!encrypted) {
            alert("Failed to encrypt message. Please try again.");
            return;
        }
        
        const msgId = uuid.v4();
        const msgData = {
            user_id: userId,
            message: encrypted,
            msg_id: msgId,
            type: "text",
            timestamp: Math.floor(Date.now() / 1000)
        };
        
        // Show message immediately for better UX
        processedMessageIds.add(msgId);
        appendMessage({
            user_id: userId,
            contentHtml: escapeHtml(message),
            isSent: true,
            timestamp: msgData.timestamp
        });
        
        console.log("Sending encrypted message:", msgId);
        socket.emit("message", msgData);
        messageInput.value = "";
        clearTimeout(typingTimeout);
        socket.emit("stop_typing", { user_id: userId });
    };

    messageInput.addEventListener("input", () => {
        const userId = localStorage.getItem("userId") || "Unknown";
        socket.emit("typing", { user_id: userId });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => socket.emit("stop_typing", { user_id: userId }), 1000);
    });

    messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendButton.click();
    });

    // Send file
    fileButton.onclick = async () => {
        const userId = localStorage.getItem("userId") || "Unknown";
        const file = fileInput.files[0];
        
        if (!file || !userId || file.size > 1 * 1024 * 1024) {
            alert("Please select a valid file (max 1MB).");
            return;
        }
        
        // Ensure encryption is ready
        if (!keyReady) {
            console.log("Encryption not ready, initializing...");
            await initializeEncryption();
        }
        
        const reader = new FileReader();
        reader.onload = () => {
            const base64Data = reader.result.split(',')[1];
            const encrypted = encryptMessage(base64Data);
            if (!encrypted) {
                alert("Failed to encrypt file. Please try again.");
                return;
            }
            
            const msgId = uuid.v4();
            const msgData = {
                user_id: userId,
                message: encrypted,
                msg_id: msgId,
                type: "file",
                filename: file.name,
                timestamp: Math.floor(Date.now() / 1000)
            };
            
            // Show file message immediately
            processedMessageIds.add(msgId);
            appendMessage({
                user_id: userId,
                contentHtml: `<a href="${reader.result}" download="${escapeHtml(file.name)}" class="underline" style="color: var(--brand-strong);">Download ${escapeHtml(file.name)}</a>`,
                isSent: true,
                timestamp: msgData.timestamp
            });
            
            console.log("Sending encrypted file:", msgId);
            socket.emit("message", msgData);
            fileInput.value = "";
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
