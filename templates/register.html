<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register - Chatify</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#f5f7fa,#e8eef5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Create an account</h2>

        <form method="post" action="/register" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input name="username" required class="mt-1 block w-full rounded-full border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="mt-1 block w-full rounded-full border border-gray-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" />
            </div>
            <div class="flex items-center justify-between">
                <a href="/login" class="text-sm text-blue-600">Login</a>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-full">Register</button>
            </div>
        </form>
    </div>
</body>
</html>
